<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue — Blood Bowl Club</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .wave-icon {
      font-size: 48px; text-align: center; margin-bottom: var(--p1);
      animation: wave 1.5s ease-in-out infinite;
      transform-origin: 70% 70%;
      display: inline-block;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(20deg); }
      40% { transform: rotate(-10deg); }
      60% { transform: rotate(15deg); }
    }
  </style>
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-card flex-col gap-1 text-center">
        <div class="wave-icon">👋</div>

        <div class="pt-1">
          <div class="h2-gras">Bienvenue !</div>
          <div class="text-small text-dark-2" style="margin-top:8px;">Nous sommes ravis de vous revoir !</div>
        </div>

        <div style="height: var(--p1);"></div>

        <button class="btn btn-primary" onclick="window.location.href='app-home.html'">
          J'accède à l'application
        </button>
      </div>
    </div>

    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
