<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une ligue — Blood Bowl Club</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/layout-app.css">
  <link rel="stylesheet" href="/static/css/pages/app-league-create.css">
</head>
<body>
  <div class="app-layout">
    <div class="sidebar">
      <div class="sidebar-top"></div>
      <div class="league-btn league-btn-active">TC</div>
      <div class="league-btn">KC</div>
      <div class="league-btn">LM</div>
      <div class="league-btn" style="background: var(--dark-3); font-size: 24px;">+</div>
    </div>

    <div class="main-area">
      <div class="menu-bar">
        <div class="menu-bar-inner">
          <div class="menu-left">
            <div class="menu-logo">
              <div class="menu-logo-icon">BBC</div>
              <span class="menu-logo-text">Blood Bowl Club</span>
            </div>
            <a class="menu-item" href="../../src/web/templates/app-layout.html">Accueil</a>
            <a class="menu-item active" href="app-competition-list.html">Compétitions</a>
            <a class="menu-item">Règles du jeu</a>
          </div>
          <div class="menu-right">
            <a class="menu-item">Administration</a>
            <div class="menu-account">👤</div>
          </div>
        </div>
        <div class="sub-menu-placeholder"></div>
      </div>

      <div class="page-content">
        <div class="create-card">
          <!-- Header banner -->
          <div class="create-header">
            <div class="create-header-icon">🏟️</div>
            <div class="create-header-text">
              <div class="title">Créer une nouvelle compétition</div>
              <div class="sub">Configurez votre ligue ou tournoi Blood Bowl</div>
            </div>
          </div>

          <!-- Steps indicator -->
          <div class="steps">
            <div class="step">
              <div class="step-num active">1</div>
              <div class="step-label active">Informations</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
              <div class="step-num pending">2</div>
              <div class="step-label pending">Règles</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
              <div class="step-num pending">3</div>
              <div class="step-label pending">Équipes</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
              <div class="step-num pending">4</div>
              <div class="step-label pending">Validation</div>
            </div>
          </div>

          <!-- Step 1 content -->
          <div style="height: var(--p1);"></div>

          <div class="form-group" style="margin-bottom: var(--p2);">
            <label class="form-label" style="font-size: var(--text-small); color: var(--dark-1); font-weight: 500; margin-bottom: 8px;">Nom de votre compétition</label>
            <input type="text" class="form-input" placeholder="ex : Ligue de la Ville de Rennes — Saison 5">
          </div>

          <div class="two-col" style="margin-bottom: var(--p4);">
            <div>
              <div class="text-small" style="font-weight:500; color: var(--dark-1); margin-bottom: var(--p1);">Administrateurs</div>
              <select class="form-select">
                <option>Sélectionnez un coach...</option>
                <option>Colonel Castor</option>
                <option>Le Tacticien</option>
                <option>Whiskers</option>
              </select>
            </div>
            <div>
              <div class="text-small" style="font-weight:500; color: var(--dark-1); margin-bottom: var(--p1);">Logo de votre compétition</div>
              <div class="upload-preview">
                <div style="font-size: 40px; color: var(--dark-3);">🖼️</div>
                <div class="text-small text-dark-2">Cliquez pour uploader</div>
                <div class="text-tiny text-dark-3">PNG, JPG jusqu'à 5 Mo</div>
              </div>
            </div>
          </div>

          <div style="text-align: right;">
            <button class="btn btn-primary" style="width: auto; padding: var(--p1) var(--p4);" onclick="window.location.href='app-league-rules.html'">
              Suivant →
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
