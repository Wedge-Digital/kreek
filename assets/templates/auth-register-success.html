<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compte créé — Blood Bowl Club</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .success-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(98,149,132,0.15); display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto var(--p2);
    }
  </style>
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-card flex-col gap-1 text-center">
        <div class="success-icon">✓</div>

        <div class="pt-2">
          <div class="h2-gras" style="color: var(--green);">Compte créé !</div>
          <div class="text-small text-dark-2" style="margin-top:8px;">Bienvenue parmi nous !</div>
        </div>

        <div style="height: var(--p1);"></div>

        <button class="btn btn-primary" onclick="window.location.href='auth-login.html'">
          Je me connecte
        </button>
      </div>
    </div>

    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
