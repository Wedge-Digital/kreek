<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — Blood Bowl Club</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/layout-auth.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-card flex-col gap-1">
        <div class="pt-2">
          <div class="h2-gras">Réinitialiser votre mot de passe</div>
        </div>
        <div class="pb-2">
          <div class="text-small text-dark-2">Saisissez votre nouveau mot de passe</div>
        </div>

        <div class="form-group">
          <label class="form-label">Nouveau mot de passe</label>
          <input type="password" class="form-input" placeholder="••••••••">
          <div class="form-error"></div>
        </div>

        <div style="height: 16px;"></div>

        <div class="form-group">
          <label class="form-label">Confirmer le mot de passe</label>
          <input type="password" class="form-input" placeholder="••••••••">
          <div class="form-error"></div>
        </div>

        <div style="height: 16px;"></div>

        <button class="btn btn-primary" onclick="window.location.href='auth-welcome-back.html'">
          Réinitialiser
        </button>

        <div style="height: 16px;"></div>

        <button class="btn btn-outline" onclick="window.location.href='auth-login.html'">
          Retour
        </button>
      </div>
    </div>

    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
