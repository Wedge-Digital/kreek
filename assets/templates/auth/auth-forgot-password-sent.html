<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email envoyé — Blood Bowl Club</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/layout-auth.css">
  <link rel="stylesheet" href="/static/css/pages/auth-forgot-password-sent.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-card flex-col gap-1 text-center">
        <div class="mail-icon">✉️</div>

        <div class="pt-1 pb-1">
          <div class="h2-gras">Demande de récupération envoyée</div>
        </div>
        <div class="pb-2">
          <div class="text-small text-dark-2">
            Vérifiez votre email — vous devriez recevoir un lien de réinitialisation dans quelques minutes.
          </div>
        </div>

        <div style="height: var(--p2);"></div>

        <button class="btn btn-outline" onclick="window.location.href='auth-login.html'">
          Retour au login
        </button>
      </div>
    </div>

    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
