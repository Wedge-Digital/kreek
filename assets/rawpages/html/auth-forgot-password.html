<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Blood Bowl Club</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-card flex-col gap-1">
        <div class="pt-2">
          <div class="h2-gras">Récupérer votre mot de passe</div>
        </div>
        <div class="pb-2">
          <div class="text-small text-dark-2">Saisissez votre nom de coach</div>
        </div>

        <div class="form-group">
          <label class="form-label">Nom du coach</label>
          <input type="text" class="form-input" placeholder="Votre nom de coach">
        </div>

        <div style="height: 16px;"></div>

        <button class="btn btn-primary" onclick="window.location.href='auth-forgot-password-sent.html'">
          Récupérer mon mot de passe
        </button>

        <div class="text-small text-dark-1" style="margin: var(--p1) 0; font-size: var(--text-tiny); color: var(--dark-2);">
          Un email vous sera envoyé avec les instructions pour réinitialiser votre mot de passe.
        </div>

        <button class="btn btn-outline" onclick="window.location.href='auth-login.html'">
          Retour
        </button>
      </div>
    </div>

    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
