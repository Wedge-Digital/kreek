<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — Blood Bowl Club</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-card flex-col gap-1">
        <div>
          <div class="h2-gras">Créer votre compte</div>
          <div class="text-small text-dark-2" style="margin-top:6px;">Quelques informations pour démarrer</div>
        </div>

        <div style="height: var(--p1);"></div>

        <div class="form-group">
          <label class="form-label">Nom du coach</label>
          <input type="text" class="form-input" placeholder="Votre nom de coach">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Adresse email</label>
          <input type="email" class="form-input" placeholder="exemple@mail.com">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" placeholder="••••••••">
          <div class="form-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmer le mot de passe</label>
          <input type="password" class="form-input" placeholder="••••••••">
          <div class="form-error"></div>
        </div>

        <div style="height: var(--p05);"></div>
        <button class="btn btn-primary" onclick="window.location.href='auth-register-success.html'">
          Créer mon compte
        </button>
        <div style="height: var(--p1);"></div>
        <button class="btn btn-outline" onclick="window.location.href='auth-login.html'">
          Retour
        </button>
      </div>
    </div>

    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
