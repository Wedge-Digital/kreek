<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Blood Bowl Club</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .logo-img {
      width: 60px; height: 60px; border-radius: 14px;
      background: var(--dark-0); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title); font-weight: 900; font-size: 20px; color: var(--white);
      margin: 0 auto var(--p2);
    }
  </style>
</head>
<body>
  <div class="auth-layout">
    <!-- Left: Form -->
    <div class="auth-left">
      <div class="auth-card flex-col gap-1">
        <div class="logo-img">BBC</div>

        <div class="text-center">
          <div class="h2-gras">Bienvenue !</div>
          <div class="text-small text-dark-2" style="margin-top:6px;">Connectez-vous à votre espace</div>
        </div>

        <div style="height: var(--p2);"></div>

        <div class="form-group">
          <label class="form-label">Nom du coach</label>
          <input type="text" class="form-input" placeholder="Votre nom de coach">
        </div>
        <div style="height: 4px;"></div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" placeholder="••••••••">
        </div>

        <div style="height: var(--p1);"></div>

        <button class="btn btn-primary">Se connecter</button>

        <button class="btn btn-text" onclick="window.location.href='auth-forgot-password.html'">
          Mot de passe oublié ?
        </button>

        <div class="separator"></div>

        <div class="text-center text-small text-dark-2">Nouvel utilisateur ?</div>
        <button class="btn btn-outline" onclick="window.location.href='auth-register.html'">
          Créer un compte
        </button>
      </div>
    </div>

    <!-- Right: Decorative -->
    <div class="auth-right">
      <div class="fancy-logo">
        <div class="fancy-logo-emblem">
          <div class="fancy-logo-emblem-inner">BBC</div>
        </div>
        <div class="fancy-logo-title">Blood Bowl<br>Club</div>
        <div class="fancy-logo-subtitle">La plateforme de gestion<br>de vos ligues de Blood Bowl</div>
        <div class="fancy-logo-dots">
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
          <div class="fancy-logo-dot"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
