{% extends "app-layout.html" %}

{% block content %}
{# Page d'assemblage : aucun view model, aucune logique. Deux conteneurs qui
   chargent leur widget et se resynchronisent sur `basketChanged`. #}
<link rel="stylesheet" href="/static/css/widgets/rec-page.css">

<div class="rec-page">
  <div class="rec-grid">

    <div class="rec-main"
         hx-get="{{ catalog_url }}"
         hx-trigger="load, basketChanged from:body"
         hx-target="this"
         hx-swap="innerHTML"></div>

    <div class="rec-side"
         hx-get="{{ cart_url }}"
         hx-trigger="load, basketChanged from:body"
         hx-target="this"
         hx-swap="innerHTML"></div>

  </div>
</div>
{% endblock %}
