<div class="admin-panel" hx-disinherit="*">
  <div class="panel-header">
    <div class="panel-title">Équipes inscrites</div>
    <span class="panel-count panel-count--enrolled">{{ teams.len() }}</span>
  </div>

  <div class="enrollment-list">
    {% for t in teams %}
    <div class="enrollment-row">
      <div class="enrollment-logo">{{ t.team_initials }}</div>
      <div class="enrollment-info">
        <div class="enrollment-name">{{ t.team_name }}</div>
        <div class="enrollment-meta">
          <span>Coach : <strong>{{ t.coach_name }}</strong></span>
          <span>·</span>
          <span>Roster : {{ t.roster_name }}</span>
        </div>
      </div>
      <span class="enrollment-status status--enrolled">Inscrite</span>
      <div class="enrollment-actions">
        <button class="action-btn action-btn--danger"
                hx-post="{{ app_routes.teams.dismiss_enrollment(space_id, t.team_id) }}"
                hx-swap="none">
          <span class="action-btn-icon">🚫</span> Renvoyer
        </button>
      </div>
    </div>
    {% endfor %}

    {% if teams.is_empty() %}
    <div class="empty-state">
      <div class="empty-state-icon">👥</div>
      <div class="empty-state-text">Aucune équipe inscrite pour le moment</div>
    </div>
    {% endif %}
  </div>
</div>
