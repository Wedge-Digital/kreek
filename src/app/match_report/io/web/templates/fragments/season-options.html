<select id="season-select" name="season_id"
        hx-get="{{ rounds_url }}"
        hx-trigger="change"
        hx-target="#round-container"
        hx-swap="innerHTML"
        hx-include="this">
  <option value="">Choisir une saison…</option>
  {% for s in seasons %}
  <option value="{{ s.id }}" {% if s.selected %}selected{% endif %}>{{ s.name }}</option>
  {% endfor %}
</select>
<script>
(function() {
  var el = document.getElementById('season-select');
  if (el && !el.tomselect) new TomSelect(el, { searchField: ['text'] });
})();
</script>
