{% extends "app-layout.html" %}

{% block content %}
<link rel="stylesheet" href="/static/css/pages/match-report-shared.css">
<link rel="stylesheet" href="/static/css/pages/match-report-inducements.css">

<div class="mr-container"
     x-data="{
       items: [],
       totalCost: 0,
       budget: {{ budget }},
       get overBudget() { return this.totalCost > this.budget; },
       get selectionJson() {
         return JSON.stringify(this.items.map(i => ({ uid: i.uid, name: i.name, qty: i.qty, unit_cost: i.unit_cost })));
       }
     }"
     @inducement-selection-changed.window="items = $event.detail.items; totalCost = $event.detail.total_cost">

  <!-- Header -->
  <div class="mr-header">
    <div class="mr-header-icon">&#128722;</div>
    <div class="mr-header-title">Coups de pouce</div>
    <div class="mr-header-sub">Achetez des inducements pour rééquilibrer le match</div>
  </div>

  <!-- Étapes -->
  <div class="mr-steps">
    <div class="mr-step mr-step--done">&#10003;</div>
    <div class="mr-step-line mr-step-line--done"></div>
    <div class="mr-step mr-step--active">2</div>
    <div class="mr-step-line"></div>
    <div class="mr-step mr-step--pending">3</div>
    <div class="mr-step-line"></div>
    <div class="mr-step mr-step--pending">4</div>
    <div class="mr-step-line"></div>
    <div class="mr-step mr-step--pending">5</div>
  </div>

  <!-- Bannière équipe + budget (combinée) -->
  <div class="mr-budget-banner mr-team-banner">
    <div class="mr-budget-team">
      <div class="mr-budget-logo">{{ team_initials }}</div>
      <div class="mr-budget-info">
        <div class="mr-budget-name">{{ team_name }}</div>
        <div class="mr-budget-label">{{ order_label }}</div>
      </div>
    </div>
    <div class="mr-budget-amount">
      <div class="mr-budget-value">{{ budget }}</div>
      <div class="mr-budget-unit">kPo</div>
    </div>
  </div>

  <!-- Widget inducement-selector chargé via HTMX -->
  <div class="mr-selector-zone"
       hx-get="{{ inducement_selector_url }}"
       hx-trigger="load"
       hx-target="this"
       hx-swap="innerHTML">
    <div class="mr-loading">Chargement des inducements…</div>
  </div>

  <!-- Cart sticky footer -->
  <form method="post" action="{{ form_action }}" class="mr-cart-footer">
    <input type="hidden" name="selection" :value="selectionJson">
    <div class="mr-cart-inner">

      <div class="mr-cart-summary">
        <div class="mr-cart-items"
             x-text="items.length === 0 ? 'Aucun coup de pouce sélectionné' : items.length + ' coup(s) de pouce sélectionné(s)'">
        </div>
        <div class="mr-cart-total">
          <span class="mr-cart-total-value" :class="{ 'mr-cart-total-value--over': overBudget }"
                x-text="totalCost"></span>
          <span class="mr-cart-total-unit">/ {{ budget }} kPo</span>
        </div>
      </div>

      <div class="mr-cart-remaining mr-cart-remaining--over" x-show="overBudget">
        &#9888;&#65039; Budget dépassé de <span x-text="totalCost - budget"></span> kPo
      </div>

      <div class="mr-cart-actions">
        <a href="{{ pass_url }}" class="btn-outline-sm">Passer</a>
        <button type="submit" class="btn-primary-sm" :disabled="overBudget">
          Valider les achats &#8594;
        </button>
      </div>

    </div>
  </form>

</div>
{% endblock %}
