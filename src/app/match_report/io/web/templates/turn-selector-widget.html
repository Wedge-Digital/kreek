<link rel="stylesheet" href="/static/css/pages/match-report-shared.css">
<div class="mr-turn-grid" hx-disinherit="*">
    {% for turn in turns %}
    <button class="mr-turn-btn {% if turn.has_action %}has-action{% endif %}"
            type="button"
            data-turn="{{ turn.turn }}">
        {{ turn.turn }}
    </button>
    {% endfor %}
    <script>
    (function () {
        const grid = document.currentScript.parentElement;
        grid.querySelectorAll('.mr-turn-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                grid.querySelectorAll('.mr-turn-btn').forEach(function (b) {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                htmx.trigger(document.body, 'turnSelected', { turn: parseInt(btn.dataset.turn) });
            });
        });
    })();
    </script>
</div>
