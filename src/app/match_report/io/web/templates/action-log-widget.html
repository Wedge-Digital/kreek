<link rel="stylesheet" href="/static/css/pages/match-report-shared.css">
<div class="mr-card" hx-disinherit="*">
    <div class="mr-log-title">Journal des actions</div>
    {% if actions.is_empty() %}
    <div class="mr-log-empty">Aucune action enregistrée.</div>
    {% else %}
    <div class="mr-log">
        {% for action in actions %}
        <div class="mr-log-entry">
            <div class="mr-log-turn">T{{ action.turn }}</div>
            <div class="mr-log-icon">{{ action.action_icon }}</div>
            <div class="mr-log-text">
                {% if !action.player_name.is_empty() %}<strong>{{ action.player_name }}</strong> — {% endif %}{{ action.action_label }}
            </div>
            <button type="button"
                    class="mr-log-delete"
                    hx-delete="{{ action.delete_url }}"
                    hx-swap="none">
                ✕
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
