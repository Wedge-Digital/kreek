<link rel="stylesheet" href="/static/css/widgets/action-log.css">
<div class="action-log" hx-disinherit="*"
     hx-trigger="actionRecorded from:body, actionDeleted from:body"
     hx-get=""
     hx-target="this"
     hx-swap="outerHTML">
    {% if actions.is_empty() %}
    <p class="action-log-empty">Aucune action enregistrée.</p>
    {% else %}
    <table class="action-log-table">
        <thead>
            <tr>
                <th>Tour</th>
                <th>Joueur</th>
                <th>Action</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for action in actions %}
            <tr>
                <td>{{ action.turn }}</td>
                <td>{{ action.player_name }}</td>
                <td>{{ action.action_label }}</td>
                <td>
                    <button type="button"
                            hx-delete="{{ action.delete_url }}"
                            hx-confirm="Supprimer cette action ?"
                            class="action-log-delete">
                        ✕
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% endif %}
</div>
