<div id="league-selector-container"
     x-data="leagueSelector('{{ on_select }}')">
  <div class="league-selector-label">Ligue de référence</div>
  <select class="league-select" @change="onSelect($event.target.value)">
    <option value="">Choisissez une ligue…</option>
    {% for league in leagues %}
    <option value="{{ league.uid }}"{% if league.is_selected %} selected{% endif %}>{{ league.label }}</option>
    {% endfor %}
  </select>
</div>
