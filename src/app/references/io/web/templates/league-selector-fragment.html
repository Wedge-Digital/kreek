<div id="league-selector-container" hx-disinherit="*">
  <div class="league-selector-label">Ligue de référence</div>
  {% if leagues.is_empty() %}
    <div class="selector-none">Pas de ligue disponible</div>
  {% else if leagues.len() == 1 %}
    <select class="league-select" disabled>
      {% for league in leagues %}
      <option value="{{ league.uid }}" selected>{{ league.label }}</option>
      {% endfor %}
    </select>
  {% else %}
    <select class="league-select"
            hx-post="{{ on_select }}"
            hx-ext="json-enc"
            hx-vals='js:{"league_id": event.target.value}'
            hx-trigger="change"
            hx-swap="none">
      <option value="">Choisissez une ligue…</option>
      {% for league in leagues %}
      <option value="{{ league.uid }}"{% if league.is_selected %} selected{% endif %}>{{ league.label }}</option>
      {% endfor %}
    </select>
  {% endif %}
</div>
