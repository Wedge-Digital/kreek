<div id="skill-picker-container"
     x-data="skillPicker({{ skills_json }}, {{ categories_json }}, {{ spp_remaining }}, {{ pricing_json }}, {{ initial_mode_json }}, {{ initial_filters_json }})"
     @spp-updated.window="sppRemaining = $event.detail.sppRemaining">

  <!-- Contrôles : mode + filtres -->
  <div class="skill-controls">

    <div class="control-group">
      <span class="control-label">Mode</span>
      <div class="mode-toggle">
        <button class="mode-btn" :class="mode === 'chosen' ? 'active-chosen' : ''"
                @click="mode = 'chosen'">✓ Choisie</button>
        <button class="mode-btn" :class="mode === 'random' ? 'active-random' : ''"
                @click="mode = 'random'">🎲 Aléatoire</button>
      </div>
      <span class="cost-hint">
        Choisie :
        <span class="cost-chosen" x-text="pricing.chosen.primary + ' SPP'"></span> /
        <span class="cost-chosen" style="opacity:.7" x-text="pricing.chosen.secondary + ' SPP'"></span>
        &nbsp;·&nbsp; Aléatoire :
        <span class="cost-random" x-text="pricing.random + ' SPP'"></span>
      </span>
    </div>

    <div class="control-group" style="align-items:flex-start;">
      <span class="control-label" style="margin-top:14px;">Filtre</span>
      <div class="filter-pills">

        <div class="filter-pill-group-wrap">
          <span class="filter-group-label">&nbsp;</span>
          <div class="filter-pill-group">
            <button class="filter-pill"
                    :class="activeFilters.length === 0 ? 'active' : ''"
                    @click="activeFilters = []">Tout</button>
          </div>
        </div>

        <div class="filter-group-sep"></div>

        <div class="filter-pill-group-wrap">
          <span class="filter-group-label">Priorité</span>
          <div class="filter-pill-group">
            <button class="filter-pill"
                    :class="activeFilters.includes('primary') ? 'active' : ''"
                    @click="toggleFilter('primary')">Primaires</button>
            <button class="filter-pill"
                    :class="activeFilters.includes('secondary') ? 'active' : ''"
                    @click="toggleFilter('secondary')">Secondaires</button>
          </div>
        </div>

        <div class="filter-group-sep"></div>

        <div class="filter-pill-group-wrap">
          <span class="filter-group-label">Nature</span>
          <div class="filter-pill-group">
            <button class="filter-pill"
                    :class="activeFilters.includes('elite') ? 'active' : ''"
                    @click="toggleFilter('elite')">Élite</button>
            <button class="filter-pill"
                    :class="activeFilters.includes('standard') ? 'active' : ''"
                    @click="toggleFilter('standard')">Standard</button>
          </div>
        </div>

        <div class="filter-group-sep"></div>

        <div class="filter-pill-group-wrap">
          <span class="filter-group-label">Type</span>
          <div class="filter-pill-group">
            <template x-for="cat in categories" :key="cat.id">
              <button class="filter-pill"
                      :class="activeFilters.includes(cat.id) ? 'active' : ''"
                      @click="toggleFilter(cat.id)"
                      x-text="cat.label"></button>
            </template>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Table compétences -->
  <div class="skill-list">
    <table class="skill-list-table">
      <thead>
        <tr>
          <th style="min-width:200px;">Compétence</th>
          <th>Type</th>
          <th>Accès</th>
          <th>Coût</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="skill in filteredSkills" :key="skill.id">
          <tr :class="{ 'row-disabled': !skill.isAcquired && !canAfford(skill) }">
            <td>
              <div class="skill-name-row">
                <span class="skill-name" x-text="skill.name"></span>
                <span class="skill-elite-badge" x-show="skill.isElite">Élite</span>
              </div>
            </td>
            <td>
              <span class="skill-type-pill" :class="skill.categoryCss"
                    x-text="skill.categoryLabel"></span>
            </td>
            <td>
              <span class="skill-type-pill"
                    :class="skill.isPrimary ? 'access-normal' : 'access-elite'"
                    x-text="skill.isPrimary ? 'Primaire' : 'Secondaire'"></span>
            </td>
            <td>
              <span class="spp-cost"
                    :class="mode === 'chosen' ? 'spp-cost-chosen' : 'spp-cost-random'"
                    x-text="currentCost(skill) + ' SPP'"></span>
            </td>
            <td>
              <!-- Déjà attribuée -->
              <button class="btn-add-skill already"
                      x-show="skill.isAcquired"
                      @click="$dispatch('skill-cancel-request', { skillId: skill.id })">
                ✓ Attribuée &nbsp;✕
              </button>
              <!-- Budget insuffisant -->
              <button class="btn-add-skill"
                      :class="mode === 'random' ? 'random' : ''"
                      x-show="!skill.isAcquired && !canAfford(skill)"
                      disabled>Budget insuf.</button>
              <!-- Disponible — random désactivé pour secondaires -->
              <button class="btn-add-skill"
                      :class="mode === 'random' ? 'random' : ''"
                      x-show="!skill.isAcquired && canAfford(skill)"
                      :disabled="mode === 'random' && !skill.isPrimary"
                      @click="$dispatch('skill-selected', {
                        skillId:   skill.id,
                        skillName: skill.name,
                        category:  skill.category,
                        isPrimary: skill.isPrimary,
                        isElite:   skill.isElite,
                        mode:      mode
                      })"
                      x-text="mode === 'chosen' ? '+ Choisir' : '🎲 Tirer'"></button>
            </td>
          </tr>
        </template>
        <tr x-show="filteredSkills.length === 0">
          <td colspan="5" style="text-align:center;color:var(--dark-3);font-style:italic;padding:var(--p2);">
            Aucune compétence dans cette catégorie.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
function skillPicker(skills, categories, sppRemaining, pricing, initialMode, initialFilters) {
  return {
    skills,
    categories,
    sppRemaining,
    pricing,
    mode:          initialMode    || 'chosen',
    activeFilters: initialFilters || [],

    init() {
      this.$watch('mode',          v => this.$dispatch('picker-mode-changed',    { mode: v }));
      this.$watch('activeFilters', v => this.$dispatch('picker-filters-changed', { filters: [...v] }));
    },

    get filteredSkills() {
      if (this.activeFilters.length === 0) return this.skills;
      const access = this.activeFilters.filter(f => f === 'primary' || f === 'secondary');
      const nature = this.activeFilters.filter(f => f === 'elite'   || f === 'standard');
      const types  = this.activeFilters.filter(f => f !== 'primary' && f !== 'secondary' && f !== 'elite' && f !== 'standard');
      return this.skills.filter(s => {
        if (access.length > 0 && !access.some(f => f === 'primary' ?  s.isPrimary : !s.isPrimary)) return false;
        if (nature.length > 0 && !nature.some(f => f === 'elite'   ?  s.isElite   : !s.isElite))   return false;
        if (types.length  > 0 && !types.some(f  => s.category === f))                               return false;
        return true;
      });
    },

    toggleFilter(key) {
      const idx = this.activeFilters.indexOf(key);
      if (idx !== -1) this.activeFilters.splice(idx, 1);
      else            this.activeFilters.push(key);
    },

    canAfford(skill) {
      return this.sppRemaining >= this.currentCost(skill);
    },

    currentCost(skill) {
      if (this.mode === 'random') {
        return skill.isElite ? this.pricing.randomElite : this.pricing.random;
      }
      const costs = skill.isElite ? this.pricing.chosenElite : this.pricing.chosen;
      return skill.isPrimary ? costs.primary : costs.secondary;
    },
  };
}
</script>
