<template id="tpl-inducement-picker" data-picker="inducement">
  <div class="inducement-grid">
    {% for item in inducements %}
    <span class="inducement-chip" data-uid="{{ item.uid }}">
      {{ item.name }}
      <small class="picker-cost">{{ item.cost }}</small>
    </span>
    {% endfor %}
  </div>
</template>
