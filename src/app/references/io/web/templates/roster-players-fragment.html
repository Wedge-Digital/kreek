{% for pos in positions %}
<tr id="player-row-{{ pos.uid }}">
  <td>{{ pos.max_qty_label }}</td>
  <td class="player-name">{{ pos.name }}</td>
  <td>{{ pos.cost }}</td>
  <td>{{ pos.ma }}</td><td>{{ pos.st }}</td>
  <td>{{ pos.ag }}</td><td>{{ pos.pa }}</td><td>{{ pos.av }}</td>
  <td class="player-skills">{{ pos.skills }}</td>
  <td>0</td><td>0 kPo</td>
  <td>
    <button class="tbl-btn" type="button"
            hx-post="{{ team_routes.hire_player(space_id, team_id) }}"
            hx-ext="json-enc"
            hx-vals='{"player_id":"{{ pos.uid }}"}'
            hx-target="closest tr"
            hx-swap="outerHTML">+</button>
  </td>
  <td>
    <button class="tbl-btn" type="button" disabled>−</button>
  </td>
</tr>
{% endfor %}
{% if positions.is_empty() %}
<tr>
  <td colspan="13" style="text-align:center; color:var(--dark-3); font-style:italic; padding: var(--p2);">
    Sélectionnez un roster pour afficher les postes disponibles.
  </td>
</tr>
{% endif %}
