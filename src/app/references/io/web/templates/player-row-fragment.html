<tr id="player-row-{{ row.uid }}">
  <td>{{ row.max_qty_label }}</td>
  <td class="player-name">{{ row.name }}</td>
  <td>{{ row.cost_kpo }}</td>
  <td>{{ row.ma }}</td><td>{{ row.st }}</td>
  <td>{{ row.ag }}</td><td>{{ row.pa }}</td><td>{{ row.av }}</td>
  <td class="player-skills">{{ row.skills }}</td>
  <td>{{ row.quantity }}</td>
  <td>{{ row.line_cost_kpo }}</td>
  <td>
    <button class="tbl-btn" type="button"
            hx-post="{{ team_routes.hire_player(space_id, team_id) }}"
            hx-ext="json-enc"
            hx-vals='{"player_id":"{{ row.uid }}"}'
            hx-target="closest tr"
            hx-swap="outerHTML"
            {% if row.is_max %}disabled{% endif %}>+</button>
  </td>
  <td>
    <button class="tbl-btn" type="button"
            hx-post="{{ team_routes.fire_player(space_id, team_id) }}"
            hx-ext="json-enc"
            hx-vals='{"player_id":"{{ row.uid }}"}'
            hx-target="closest tr"
            hx-swap="outerHTML"
            {% if row.quantity == 0 %}disabled{% endif %}>−</button>
  </td>
</tr>
<div id="player-table-error" class="table-error-zone" hx-swap-oob="true"></div>
