<div id="player-row-{{ player.instance_id }}" class="player-row" hx-swap-oob="true">
  <input class="jersey-input" type="number"
         name="jersey" value="{{ player.jersey }}" min="1" max="99"
         hx-post="{{ player.set_identity_url }}"
         hx-trigger="change"
         hx-ext="json-enc"
         hx-include="[name='name']"
         hx-target="#player-row-{{ player.instance_id }}"
         hx-swap="outerHTML">
  <div class="player-row-info">
    <input class="player-name-input" type="text"
           name="name" value="{{ player.personal_name }}" placeholder="Nom du joueur"
           hx-post="{{ player.set_identity_url }}"
           hx-trigger="blur"
           hx-ext="json-enc"
           hx-include="[name='jersey']"
           hx-target="#player-row-{{ player.instance_id }}"
           hx-swap="outerHTML">
    <div class="player-row-pos">{{ player.position_name }}</div>
    {% if !player.skills.is_empty() %}
    <div class="player-row-skills">{{ player.skills }}</div>
    {% endif %}
  </div>
  {% if player.skills_acquired_count > 0 %}
  <div class="skills-acquired-badge">{{ player.skills_acquired_count }} compét.</div>
  {% endif %}
</div>
