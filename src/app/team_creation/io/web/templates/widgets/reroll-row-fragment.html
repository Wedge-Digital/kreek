<tr id="staff-row-reroll">
  <td>0-{{ reroll.max }}</td>
  <td class="staff-name">Relances</td>
  <td>{{ reroll.price }}</td>
  <td>{{ reroll.quantity }}</td>
  <td>{{ reroll.line_cost }}</td>
  <td>
    <button class="tbl-btn" type="button"
            hx-post="{{ app_routes.team_creation.buy_reroll(space_id, team_id) }}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            {% if reroll.quantity >= reroll.max %}disabled{% endif %}>+</button>
  </td>
  <td>
    <button class="tbl-btn" type="button"
            hx-post="{{ app_routes.team_creation.remove_reroll(space_id, team_id) }}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            {% if reroll.quantity == 0 %}disabled{% endif %}>−</button>
  </td>
</tr>
<div id="staff-table-error" class="table-error-zone" hx-swap-oob="true"></div>
