<div id="new-space-card" class="create-card new-space">
    <div class="create-header">
        <div class="create-header-icon">🏈</div>
        <div class="create-header-text">
            <div class="title">Créer un nouvel espace</div>
            <div class="sub">Un espace est le lieu ou vous crééerez vos compétition, vos équipes etc....</div>
        </div>
    </div>

    <form class="create-body new-space"
          hx-post="/app/space/create"
          hx-target="#new-space-card"
          hx-swap="outerHTML">

        <div class="form-label">Logo de votre espace</div>
            <input type="hidden" id="logo_url" name="logo_url" value="{{ logo_url_value }}">
            <div class="upload-preview" id="upload-zone">
                <img id="logo-preview" src="{{ logo_url_value }}" alt="Logo de votre équipe"
                     {% if logo_url_value.is_empty() %}style="display:none"{% endif %}>
                <div id="upload-placeholder" {% if !logo_url_value.is_empty() %}style="display:none"{% endif %}>
                    <div style="font-size: 36px; color: var(--dark-3);">🖼️</div>
                    <div class="text-small text-dark-2">Uploader un logo</div>
                </div>
            {% if let Some(err) = logo_error %}
            <div class="form-error">{{ err }}</div>
            {% endif %}
            <script>
                (function () {
                    const widget = cloudinary.createUploadWidget({
                        cloudName: 'bloodbowlclub-com',
                        uploadPreset: 'fvqrusn5',
                        sources: ['local', 'url'],
                        multiple: false,
                        maxFileSize: 2000000,
                        clientAllowedFormats: ['jpg', 'png', 'webp'],
                        folder: 'spaces/logos'
                    }, function (error, result) {
                        if (!error && result && result.event === 'success') {
                            const url = result.info.secure_url;
                            document.getElementById('logo_url').value = url;
                            const preview = document.getElementById('logo-preview');
                            preview.src = url;
                            preview.style.display = 'block';
                            document.getElementById('upload-placeholder').style.display = 'none';
                        }
                    });
                    document.getElementById('upload-zone').addEventListener('click', function () {
                        widget.open();
                    });
                })();
            </script>
        </div>

        <div class="form-group">
            <label class="form-label">Nom de votre espace</label>
            <input type="text" class="form-input {% if space_name_error.is_some() %}form-input--error{% endif %}"
                   name="space_name"
                   placeholder="ex : LigueDesZazous"
                   value="{{ space_name_value }}">
            {% if let Some(err) = space_name_error %}
            <div class="form-error">{{ err }}</div>
            {% endif %}
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-outline"
                    hx-get="/app/space/create" hx-target="body" hx-push-url="true">
                Annuler
            </button>
            <button type="submit" class="btn btn-primary">
                Créer →
            </button>
        </div>
    </form>
</div>
