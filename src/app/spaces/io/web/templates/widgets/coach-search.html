<link rel="stylesheet" href="/static/css/widgets/coach-search.css">
<div class="coaches-search-panel" hx-disinherit="*">
    {% if !selected_coaches.is_empty() %}
    <div class="coach-selected-list">
        {% for coach in selected_coaches %}
        <div class="coach-selected-badge" data-id="{{ coach.id }}" data-name="{{ coach.name }}">
            <span class="coach-selected-badge__initials">{{ coach.initials }}</span>
            <span class="coach-selected-badge__name">{{ coach.name }}</span>
            <button type="button"
                    class="coach-selected-badge__remove"
                    onclick="const el=this.closest('.coach-selected-badge');htmx.trigger(document.body,'coachRemoved',{id:el.dataset.id,name:el.dataset.name})">×</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <div class="search-row">
    <input type="text"
           class="form-input"
           name="q"
           placeholder="Rechercher..."
           hx-get="{{ routes.coach_search_results() }}?space_id={{ space_id }}&excluded={{ excluded }}"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#coach-search-results"
           hx-indicator="#coach-search-spinner"
           hx-params="q"
           hx-swap="innerHTML">
   </div>
    <div class="coach-search-results-wrapper">
        <div id="coach-search-spinner" class="coach-search-spinner">
            <span class="coach-search-spinner__circle"></span>
        </div>
        <div id="coach-search-results">
            <div class="coach-search-results">
                {% include "widgets/_coach-result-rows.html" %}
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    const panel = document.currentScript.previousElementSibling;
    panel.addEventListener('keydown', function (e) {
        const rows = Array.from(panel.querySelectorAll('.coach-result-row'));
        const input = panel.querySelector('input[name="q"]');
        const focused = document.activeElement;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (focused === input) { rows[0]?.focus(); }
            else { rows[rows.indexOf(focused) + 1]?.focus(); }
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const idx = rows.indexOf(focused);
            if (idx <= 0) { input?.focus(); }
            else { rows[idx - 1]?.focus(); }
        } else if (e.key === 'Enter' && rows.includes(focused)) {
            e.preventDefault();
            focused.click();
        }
    });
})();
</script>
