{% if coaches.is_empty() %}
<div class="coach-search-empty">Aucun coach trouvé</div>
{% else %}
{% for coach in coaches %}
<div class="coach-result-row"
     data-id="{{ coach.id }}"
     data-name="{{ coach.coach_name }}"
     data-initials="{{ coach.initials }}">
    <div class="invited-avatar">{{ coach.initials }}</div>
    <div class="invited-info">
        <div class="invited-name">{{ coach.coach_name }}</div>
    </div>
    <button type="button" class="btn-add-coach" onclick="addCoachFromResult(this)">+ Ajouter</button>
</div>
{% endfor %}
{% endif %}
