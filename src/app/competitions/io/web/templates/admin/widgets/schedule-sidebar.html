<div class="round-sidebar" hx-disinherit="*">
  <div class="round-sidebar-header">
    <span class="round-sidebar-title">Journées</span>
    <span class="round-sidebar-count">{{ rounds.len() }}</span>
  </div>

  <div class="round-sidebar-list">
    {% for round in rounds %}
    <div class="round-item round-item--{{ round.day_type }}"
         onclick="htmx.trigger(document.body, 'roundSelected', { round_id: '{{ round.round_id }}' })">
      <div class="round-item-icon">
        {% if round.day_type == "rest" %}
        &#9728;
        {% else %}
        {{ loop.index }}
        {% endif %}
      </div>
      <div class="round-item-info">
        <div class="round-item-name">{{ round.name }}</div>
        {% if !round.date_label.is_empty() %}
        <div class="round-item-date">{{ round.date_label }}</div>
        {% endif %}
      </div>
      <span class="round-item-status round-item-status--{{ round.status }}"></span>
    </div>
    {% endfor %}

    {% if rounds.is_empty() %}
    <div class="round-sidebar-empty">Aucune journée configurée.</div>
    {% endif %}
  </div>

  <div class="round-sidebar-actions">
    <button class="btn-outline-sm"
            hx-post="{{ app_routes.competitions.admin_schedule_add_round(space_id, competition_id, season_id) }}"
            hx-ext="json-enc"
            hx-vals='{"name": ""}'
            hx-swap="none">+ Ajouter une journée</button>
    <button class="btn-outline-sm"
            hx-post="{{ app_routes.competitions.admin_schedule_add_rest(space_id, competition_id, season_id) }}"
            hx-ext="json-enc"
            hx-vals='{"name": ""}'
            hx-swap="none">&#9728; Ajouter un repos</button>
  </div>
</div>
