
{# Le second `class="schedule-actions-panel"` est supprimé (carte 487) : le
   navigateur ne retient que le premier attribut, celui-ci était donc perdu —
   et aucune feuille ne le stylait. #}
<div class="admin-panel competition-admin-schedule">
  <div class="actions-bar">
    <div class="actions-bar-left">
      <span class="info-note">
        <span class="info-note-icon">&#128197;</span>
        Gérez le calendrier des journées et les rencontres de la saison.
      </span>
    </div>
    <div class="actions-bar-right">
      <button class="btn-danger-sm"
              hx-post="{{ app_routes.competitions.admin_schedule_clear_all(space_id, competition_id, season_id) }}"
              hx-swap="none"
              hx-confirm="Vider tous les matchs de toutes les journées ?"
              hx-on::after-request="window.handleScheduleActionResponse(event.detail.xhr)">Vider tous les matchs</button>
      <button class="btn-primary-sm"
              hx-post="{{ app_routes.competitions.admin_schedule_generate_all(space_id, competition_id, season_id) }}"
              hx-swap="none"
              hx-on::after-request="window.handleScheduleActionResponse(event.detail.xhr)">Générer toutes les rencontres</button>
    </div>
  </div>
</div>

<div class="schedule-layout competition-admin-schedule">
  <div id="schedule-sidebar"
       hx-get="{{ app_routes.competitions.admin_schedule_rounds(space_id, competition_id, season_id) }}"
       hx-trigger="load, scheduleChanged from:body"
       hx-swap="innerHTML">
  </div>

  <div id="schedule-detail"
       hx-get="{{ app_routes.competitions.admin_schedule_round_detail(space_id, competition_id, season_id) }}"
       hx-trigger="roundSelected from:body, scheduleChanged from:body"
       hx-vals='js:{"round_id": (event && event.detail && event.detail.round_id) || document.body.dataset.activeRoundId || ""}'
       hx-swap="innerHTML">
  </div>
</div>

<script>
(function () {
    document.body.addEventListener('roundSelected', function (evt) {
        var roundId = evt.detail && evt.detail.round_id;
        if (!roundId) return;
        document.body.dataset.activeRoundId = roundId;
    });
})();

// Partagé avec schedule-round-detail.html (widget enfant chargé via HTMX) —
// affiche à l'admin le résultat d'une action de planification : erreur de
// refus (ex. journée déjà pourvue d'appariements), ou avertissement sur les
// équipes/journées ignorées silencieusement lors d'un appariement en masse.
// `xhrLike` : { status, responseText } — accepte aussi bien un vrai XMLHttpRequest
// (via hx-on::after-request) qu'un objet construit à la main depuis un fetch().
// Retourne true si l'action a réussi (le planning a pu changer), false sinon.
window.handleScheduleActionResponse = function (xhrLike) {
    var data = {};
    try { data = JSON.parse(xhrLike.responseText || '{}'); } catch (e) { /* corps non-JSON */ }

    if (xhrLike.status >= 400) {
        // Carte 553 — le toast d'erreur remplace l'`alert()`. Il **reste jusqu'au
        // clic** : un refus qui s'efface seul est un refus non reçu.
        window.kreekToast(data.error || 'Une erreur est survenue.', 'error');
        return false;
    }

    var messages = [];
    if (data.skipped_teams && data.skipped_teams.length) {
        messages.push("Équipe(s) non enrôlée(s) ignorée(s) : " + data.skipped_teams.join(', '));
    }
    if (data.skipped_rounds && data.skipped_rounds.length) {
        messages.push("Journée(s) déjà pourvue(s) d'appariements, non régénérée(s) : " + data.skipped_rounds.join(', '));
    }
    if (data.skipped_matches && data.skipped_matches.length) {
        messages.push("Rencontre(s) conservée(s), rapport de match déjà publié : " + data.skipped_matches.join(', '));
    }
    if (data.skipped_groups && data.skipped_groups.length) {
        messages.push("Poule(s) sans effectif suffisant (moins de 2 équipes assignées), aucun appariement généré : " + data.skipped_groups.join(', '));
    }
    // Un toast par message, et non un seul multi-lignes : `textContent` ne rend
    // pas les retours à la ligne, et chacun se ferme indépendamment.
    //
    // Type `warning` et non `success` : ces messages disent que l'action n'a pas
    // fait tout ce qu'on croyait, donc ils persistent jusqu'au clic comme une
    // erreur — mais l'action a réussi, d'où la couleur distincte.
    messages.forEach(function (m) { window.kreekToast(m, 'warning'); });
    return true;
};
</script>
