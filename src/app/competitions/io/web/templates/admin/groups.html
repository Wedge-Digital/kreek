<link rel="stylesheet" href="/static/css/pages/competition-admin-groups.css">

<div class="admin-panel competition-admin-groups" style="padding: var(--p1) var(--p2);">
  <div class="actions-bar">
    <div class="actions-bar-left">
      <span class="info-note">
        <span class="info-note-icon">💡</span>
        Glissez les équipes pour les répartir manuellement, ou utilisez le tirage aléatoire.
      </span>
    </div>
    <div class="actions-bar-right">
      <button class="btn-danger-sm"
              hx-post="{{ app_routes.competitions.admin_groups_reset(space_id, competition_id, season_id) }}"
              hx-swap="none">🗑️ Vider les poules</button>
      <button class="btn-primary-sm"
              hx-post="{{ app_routes.competitions.admin_groups_random_draw(space_id, competition_id, season_id) }}"
              hx-swap="none">🎲 Tirage aléatoire</button>
    </div>
  </div>
</div>

<div id="unassigned-pool" class="competition-admin-groups"
     hx-get="{{ app_routes.competitions.admin_groups_unassigned(space_id, competition_id, season_id) }}"
     hx-trigger="load, groupsChanged from:body"
     hx-swap="innerHTML">
</div>

<div id="group-cards" class="competition-admin-groups"
     hx-get="{{ app_routes.competitions.admin_groups_cards(space_id, competition_id, season_id) }}"
     hx-trigger="load, groupsChanged from:body"
     hx-swap="innerHTML">
</div>

<script>
(function () {
    var assignUrl = '{{ app_routes.competitions.admin_groups_assign(space_id, competition_id, season_id) }}';
    var draggedTeamId = null;

    document.addEventListener('dragstart', function (e) {
        var el = e.target.closest('[data-team-id]');
        if (!el) return;
        draggedTeamId = el.dataset.teamId;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    });

    document.addEventListener('dragend', function (e) {
        var el = e.target.closest('[data-team-id]');
        if (el) el.classList.remove('dragging');
        draggedTeamId = null;
        document.querySelectorAll('.group-drop-zone').forEach(function (z) {
            z.classList.remove('drag-over');
        });
    });

    document.addEventListener('dragover', function (e) {
        var zone = e.target.closest('.group-drop-zone, .group-card-body');
        if (zone) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            var dropZone = zone.closest('.group-card-body');
            if (dropZone) {
                var dz = dropZone.querySelector('.group-drop-zone');
                if (dz) dz.classList.add('drag-over');
            }
        }
    });

    document.addEventListener('dragleave', function (e) {
        var zone = e.target.closest('.group-drop-zone');
        if (zone) zone.classList.remove('drag-over');
    });

    document.addEventListener('drop', function (e) {
        var card = e.target.closest('.group-card');
        if (!card || !draggedTeamId) return;
        e.preventDefault();

        var groupId = card.dataset.groupId;
        fetch(assignUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'HX-Request': 'true'
            },
            body: JSON.stringify({ team_id: draggedTeamId, group_id: groupId })
        }).then(function () {
            htmx.trigger(document.body, 'groupsChanged');
        });

        draggedTeamId = null;
    });
})();
</script>
