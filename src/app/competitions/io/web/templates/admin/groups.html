<link rel="stylesheet" href="/static/css/pages/competition-admin-groups.css">

<div class="admin-panel" style="padding: var(--p1) var(--p2);">
  <div class="actions-bar">
    <div class="actions-bar-left">
      <span class="info-note">
        <span class="info-note-icon">💡</span>
        Glissez les équipes pour les répartir manuellement, ou utilisez le tirage aléatoire.
      </span>
    </div>
    <div class="actions-bar-right">
      <button class="btn-danger-sm"
              hx-post="{{ app_routes.competitions.admin_groups_reset(space_id, competition_id, season_id) }}"
              hx-swap="none">🗑️ Vider les poules</button>
      <button class="btn-primary-sm"
              hx-post="{{ app_routes.competitions.admin_groups_random_draw(space_id, competition_id, season_id) }}"
              hx-swap="none">🎲 Tirage aléatoire</button>
    </div>
  </div>
</div>

<div id="unassigned-pool"
     hx-get="{{ app_routes.competitions.admin_groups_unassigned(space_id, competition_id, season_id) }}"
     hx-trigger="load, groupsChanged from:body"
     hx-swap="innerHTML">
</div>

<div id="group-cards"
     hx-get="{{ app_routes.competitions.admin_groups_cards(space_id, competition_id, season_id) }}"
     hx-trigger="load, groupsChanged from:body"
     hx-swap="innerHTML">
</div>
