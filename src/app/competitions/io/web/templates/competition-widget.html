<link rel="stylesheet" href="/static/css/components/competition-widget.css">
<div class="competition-widget">
  {% if competitions.is_empty() %}
  <div class="competition-widget-empty">Pas de compétition disponible.</div>
  {% else %}

  <div class="form-group">
    <label class="form-label" for="competition-select">Compétition</label>
    <select id="competition-select"
            class="form-select"
            name="competition_id"
            hx-get="{{ routes.competition_widget_seasons(space_id) }}{% if show_detail %}?show_detail=true{% endif %}"
            hx-trigger="change"
            hx-target="#season-select-wrapper"
            hx-swap="innerHTML"
            hx-include="this">
      <option value="">Sélectionnez une compétition…</option>
      {% for c in competitions %}
      <option value="{{ c.competition_id }}">{{ c.competition_name }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="season-select-wrapper">
    <div class="form-group">
      <label class="form-label" for="season-select">Saison</label>
      <select id="season-select" class="form-select" disabled>
        <option value="">— Sélectionnez d'abord une compétition —</option>
      </select>
    </div>
  </div>

  {% if show_detail %}
  <div id="competition-widget-detail" class="competition-widget-detail"></div>
  {% endif %}

  {% endif %}
</div>
