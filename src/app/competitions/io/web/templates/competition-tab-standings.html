<div class="standings-table card-shadow">
    <div class="standings-header">
        <div>#</div>
        <div>Équipe</div>
        <div class="standings-header-num">MJ</div>
        <div class="standings-header-num">V</div>
        <div class="standings-header-num">N</div>
        <div class="standings-header-num">D</div>
        <div class="standings-header-num">Pts</div>
    </div>
    {% for row in standings %}
    <div class="standings-row {% if row.rank <= 3 %}top3{% endif %}">
        <div class="standings-rank">{{ row.rank }}</div>
        <div class="standings-team">{{ row.name }}</div>
        <div class="standings-num">{{ row.played }}</div>
        <div class="standings-num">{{ row.wins }}</div>
        <div class="standings-num">{{ row.draws }}</div>
        <div class="standings-num">{{ row.losses }}</div>
        <div class="standings-pts">{{ row.points }}</div>
    </div>
    {% endfor %}
    {% if standings.is_empty() %}
    <div class="standings-empty">
        Aucune équipe inscrite pour le moment.
    </div>
    {% endif %}
</div>
