<div class="form-group">
  <label class="form-label" for="season-select">Saison</label>
  {% if seasons.is_empty() %}
  <select id="season-select" class="form-select" disabled>
    <option value="">Aucune saison disponible</option>
  </select>
  {% else %}
  <select id="season-select"
          class="form-select"
          name="season_id"
          data-detail-base="{{ routes.competition_widget_detail(space_id, "") }}"
          data-show-detail="{{ show_detail }}">
    {% for s in seasons %}
    <option value="{{ s.season_id }}">
      {{ s.season_name }}{% if s.status == "ready" %} ✓{% endif %}
    </option>
    {% endfor %}
  </select>
  {% if show_detail %}
  <script>
  (function () {
    var sel    = document.getElementById('season-select');
    var detail = document.getElementById('competition-widget-detail');
    if (!sel || !detail) return;

    function loadDetail(seasonId) {
      if (!seasonId) { detail.innerHTML = ''; return; }
      var base = sel.dataset.detailBase.replace(/\/[^/]*$/, '');
      htmx.ajax('GET', base + '/' + seasonId, { target: detail, swap: 'innerHTML' });
    }

    sel.addEventListener('change', function () { loadDetail(sel.value); });
    loadDetail(sel.value);
  })();
  </script>
  {% endif %}
  {% endif %}
</div>
