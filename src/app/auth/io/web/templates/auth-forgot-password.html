<div class="auth-card flex-col gap-1">
  <div class="pt-2">
    <div class="h2-gras">Récupérer votre mot de passe</div>
  </div>
  <div class="pb-2">
    <div class="text-small text-dark-2">Saisissez votre nom de coach</div>
  </div>

  <form hx-post="{{ routes.forgot_password() }}" hx-target="#content" hx-swap="innerHTML">
    <div class="form-group">
      <label class="form-label">Nom du coach</label>
      <label>
        <input type="text" name="coach_name" class="form-input" placeholder="Votre nom de coach">
      </label>
    </div>

    {% if let Some(err) = error %}<div class="form-error text-center p-1">{{ err }}</div>
    {% else %}
    <div style="height: 16px;"></div>
    {% endif %}

    <button type="submit" class="btn btn-primary">
      Récupérer mon mot de passe
    </button>
  </form>

  <div class="text-small text-dark-1" style="margin: var(--p1) 0; font-size: var(--text-tiny); color: var(--dark-2);">
    Un email vous sera envoyé avec les instructions pour réinitialiser votre mot de passe.
  </div>

  <button class="btn btn-outline"
          hx-get="{{ routes.login() }}"
          hx-target="#content"
          hx-swap="innerHTML"
          hx-push-url="true">
    Retour
  </button>
</div>
