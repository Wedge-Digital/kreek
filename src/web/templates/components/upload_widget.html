{% macro cloudinary_upload(field_id, initial_value, folder, label, error) %}
<div class="upload-widget">
<div class="upload-title">{{ label }}</div>
<input type="hidden" id="{{ field_id }}" name="{{ field_id }}" value="{{ initial_value }}">
<div class="upload-preview" id="zone-{{ field_id }}">
    <img id="preview-{{ field_id }}" src="{{ initial_value }}" alt="{{ label }}"
         {% if initial_value.is_empty() %}hidden{% endif %}>
    <div id="placeholder-{{ field_id }}" {% if !initial_value.is_empty() %}hidden{% endif %}>
        <div class="upload-placeholder-icon">🖼️</div>
        <div class="text-small text-dark-2">Uploader un logo</div>
    </div>
    {% if let Some(err) = error %}
    <div class="form-error">{{ err }}</div>
    {% endif %}
    <script>
        (function () {
            // Le chargeur de Cloudinary vit ici et non dans le layout : il tire
            // de lui-même Google Tag Manager, GA4 et Rollbar. Il n'est donc
            // téléchargé qu'au premier clic sur la zone (carte 592) : ouvrir
            // une page qui porte le champ ne fait sortir aucune requête.
            //
            // Tout se cherche sous la racine capturée ici, pendant l'exécution
            // synchrone du script. Un rappel qui arrive après le départ de la
            // page — `all.js` encore en route quand htmx a échangé le contenu —
            // trouve sa racine détachée, et sort sans rien toucher.
            const SRC = 'https://widget.cloudinary.com/v2.0/global/all.js';
            const root = document.currentScript.closest('.upload-widget');
            let widget = null;

            // Le widget Cloudinary est créé au premier clic, puis réutilisé.
            root.querySelector('.upload-preview').addEventListener('click', function () {
                quandPret(function () {
                    if (!root.isConnected) return;
                    widget = widget || creerLeWidget();
                    widget.open();
                });
            });

            function quandPret(suite) {
                if (window.cloudinary) return suite();
                let s = document.getElementById('cloudinary-loader');
                if (!s) {
                    s = document.createElement('script');
                    s.id = 'cloudinary-loader';
                    s.src = SRC;
                    document.head.appendChild(s);
                }
                // Deux champs sur la même page partagent le chargeur : chacun
                // pose son écouteur, `all.js` n'est téléchargé qu'une fois.
                s.addEventListener('load', suite, { once: true });
            }

            function creerLeWidget() {
                return cloudinary.createUploadWidget({
                    cloudName: 'bloodbowlclub-com',
                    uploadPreset: 'fvqrusn5',
                    sources: ['local', 'url'],
                    multiple: false,
                    maxFileSize: 2000000,
                    clientAllowedFormats: ['jpg', 'png', 'webp'],
                    folder: '{{ folder }}'
                }, surResultat);
            }

            function surResultat(error, result) {
                if (!root.isConnected) return;
                if (!error && result && result.event === 'success') {
                    afficher(result.info.secure_url);
                }
                // Émis à la fermeture de la fenêtre Cloudinary, qu'un upload ait
                // réussi ou non — c'est le seul moment où l'utilisateur a
                // effectivement quitté le picker. Les widgets qui n'écoutent pas
                // cet événement (settings-general, draft-team, new-article)
                // l'ignorent simplement : rien ne change pour eux.
                if (result && result.event === 'close') {
                    htmx.trigger(document.body, 'cloudinaryUploadClosed', { fieldId: '{{ field_id }}' });
                }
            }

            // Sélecteurs d'attribut et non `#id` : l'identifiant vient de la
            // page hôte, et n'a pas à être un sélecteur CSS valide.
            function afficher(url) {
                root.querySelector('[id="{{ field_id }}"]').value = url;
                const preview = root.querySelector('[id="preview-{{ field_id }}"]');
                preview.src = url;
                preview.style.display = 'block';
                root.querySelector('[id="placeholder-{{ field_id }}"]').style.display = 'none';
            }
        })();
    </script>
</div>
</div>
{% endmacro %}
