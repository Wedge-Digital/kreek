<div class="sidebar-top"></div>
{% for space in spaces %}
<div class="league-btn{% if active_space_id.as_deref() == Some(space.id.as_str()) %} league-btn-activera{% endif %}"
     hx-trigger="click"
     hx-get="{{ news_routes.space_home(space.id) }}"
     hx-target="#app-content"
     hx-swap="innerHTML"
     hx-push-url="true"
     hx-on::after-request="htmx.trigger(document.body, 'space:changed')"
     title="{{ space.name }}">
  <img src="{{ space.logo }}" alt="{{ space.name }}" width="128" height="128">
</div>
{% endfor %}
<div class="league-btn"
     hx-trigger="click"
     hx-get="/app/space/create"
     hx-target="#app-content"
     hx-swap="innerHTML"
     hx-push-url="true"
     style="background: var(--dark-2); font-size: 24px;"
     title="Ajouter une ligue">+</div>
