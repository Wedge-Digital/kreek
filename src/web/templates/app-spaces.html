<div class="sidebar-top"></div>
{% for space in spaces %}
<div class="league-btn{% if active_space_id.as_deref() == Some(space.id.as_str()) %} league-btn-active{% endif %}"
     hx-trigger="click"
     hx-get="{{ app_routes.news.space_home(space.id) }}"
     hx-target="#app-content"
     hx-select="#app-content"
     hx-swap="innerHTML"
     hx-push-url="true"
     hx-on::after-request="htmx.trigger(document.body, 'space:changed')"
     title="{{ space.name }}">
  <img src="{{ space.logo.thumbnail(100, 100) }}" alt="{{ space.name }}" width="100" height="100">
</div>
{% endfor %}
<div class="league-btn league-btn--icon"
     hx-trigger="click"
     hx-get="{{ app_routes.spaces.register_space() }}"
     hx-target="#app-content"
     hx-select="#app-content"
     hx-swap="innerHTML"
     hx-push-url="true"
     title="Ajouter une ligue">+</div>
<div class="find-space-btn league-btn--icon"
     hx-trigger="click"
     hx-get="{{ app_routes.spaces.space_all() }}"
     hx-target="#app-content"
     hx-select="#app-content"
     hx-swap="innerHTML"
     hx-push-url="true"
     title="Rechercher une ligue">🔍</div>
