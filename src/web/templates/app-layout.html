<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreek</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/layout-app.css">
  <link rel="stylesheet" href="/static/css/components/tom-select.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.min.css">
  <script src="/static/js/htmx.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      htmx.config.responseHandling = [
        {code:"204", swap: false},
        {code:"[23]..", swap: true},
        {code:"422", swap: true},
        {code:"[45]..", swap: false}
      ];
    });
  </script>
  <script src="/static/js/htmx-ext-json-enc.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
  <link rel="stylesheet" href="/static/css/components/kreek-select.css">
  <link rel="stylesheet" href="/static/css/components/team-selection.css">
  <script src="/static/js/kreek-select.js"></script>
</head>
<body>
  <div class="app-layout" x-data="{ drawerOpen: false }">
    <!-- Desktop sidebar -->
    <div class="sidebar"
         hx-get="{{ app_routes.spaces.sidebar() }}"
         hx-trigger="load, space:changed from:body"
         hx-swap="innerHTML">
    </div>

    <div class="main-area">
      <!-- Desktop + mobile menu (loaded via HTMX) -->
      <div class="menu-zone"
           hx-trigger="load, space:changed from:body, htmx:pushedIntoHistory from:body"
           hx-get="{{ app_routes.web.menu() }}"
           hx-swap="innerHTML">
      </div>

      <!-- Content -->
      <div class="page-content">
        <div class="home-grid" id="app-content">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>

    <!-- Mobile space drawer overlay -->
    <div class="space-drawer-overlay"
         x-show="drawerOpen"
         @click="drawerOpen = false"
         x-cloak>
    </div>
    <div class="space-drawer" :class="{ open: drawerOpen }">
      <div class="space-drawer-header">
        <div class="space-drawer-title">Mes espaces</div>
      </div>
      <div class="space-drawer-list"
           @click="drawerOpen = false"
           hx-get="{{ app_routes.spaces.sidebar() }}"
           hx-trigger="load, space:changed from:body"
           hx-swap="innerHTML">
      </div>
    </div>
  </div>
</body>
</html>
