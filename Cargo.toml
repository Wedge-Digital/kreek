[package]
name = "kreek"
version = "0.1.0"
edition = "2021"

[dependencies]
ulid = "1.1.3"
serde = { version = "1.0.217", features = ["derive"] }
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "fs"] }
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio-native-tls", "macros", "time", "json"] }
time = { version = "0.3", features = ["serde"] }
serde_json = "1.0.140"
dotenvy = {version="0.15.7", features = ["clap", "cli"] }
config = "0.15.22"
nutype = { version = "0.7.0", features = ["regex", "serde"] }
askama = "0.12"
regex = "1.12.3"
tower-livereload = "0.10.3"
argon2 = "0.5"
async-trait = "0.1.89"
axum-login = "0.18"
tower-sessions = "0.14"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4.44"

[dev-dependencies]
mockito = "1"
