[package]
name = "kreek"
version = "0.1.0"
edition = "2021"

[dependencies]
ulid = "1.1.3"
serde = { version = "1.0.217", features = ["derive"] }
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["full"] }
tracing-subscriber = "0.3.19"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace"] }
sqlx = {version="0.8.3", features = ["postgres", "runtime-tokio-native-tls", "macros", "time"] }
serde_json = "1.0.140"
dotenvy = {version="0.15.7", features = ["clap", "cli"] }
