[package]
name = "kreek"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
rand = "0.10"
ulid = "1.1.3"
serde = { version = "1.0.217", features = ["derive"] }
axum = "0.8.1"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1"
# `rebuild_interest_cache`, dont `tracing` ne réexporte pas le chemin : il
# sert au harnais de capture des tests de journalisation (carte 490).
tracing-core = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tower = "0.5.2"
futures-util = "0.3"
tower-http = { version = "0.6.2", features = ["fs", "catch-panic"] }
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio-native-tls", "macros", "time", "json"] }
time = { version = "0.3", features = ["serde"] }
serde_json = "1.0.140"
dotenvy = { version = "0.15.7", default-features = false }
config = "0.15.22"
nutype = { version = "0.7.0", features = ["regex", "serde"] }
askama = "0.12"
regex = "1.12.3"
tower-livereload = "0.10.3"
argon2 = "0.5"
async-trait = "0.1.89"
axum-login = "0.18"
tower-sessions = "0.14"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
axum-extra = { version = "0.12.6", features = ["form"] }
# `default-features = false` écarte `bundler`, `nodejs` et `sourcemap`, dont
# aucun n'est utilisé : on concatène les feuilles nous-mêmes et on n'émet pas de
# source map. C'est `sourcemap` qui tirait `parcel_sourcemap`, donc `rkyv` 0.7 et
# son avis RUSTSEC-2026-0235 — bloqué en 0.7 tant que `parcel_sourcemap` n'y
# passe pas, donc impossible à corriger par une montée de version.
lightningcss = { version = "1.0.0-alpha.72", default-features = false }

[dev-dependencies]
mockito = "1"
