name: CI

on:
  # `push:` sans valeur était accepté à l'enregistrement du workflow mais ne
  # déclenchait aucun run — les branches sont désormais explicites.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer le pipeline sans commit, depuis l'onglet Actions
  # ou via `gh workflow run ci.yml`.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # `make lint` et `make check-arch` existaient depuis longtemps sans jamais
  # être exécutés ici : le formatage avait dérivé sur 288 fichiers sans que rien
  # ne le signale (carte 272). Aucune base de données n'est nécessaire — seule
  # la compilation des macros query! l'exige, d'où SQLX_OFFLINE.
  qualite:
    name: Qualité (fmt, clippy, architecture)
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: make lint (fmt + clippy)
        run: make lint

      - name: make check-arch (axes 2 à 9)
        run: make check-arch

  # Job distinct de `qualite`, et c'est délibéré : RustSec publie en continu,
  # donc un avis paru cette nuit peut faire rougir la CI sans que personne
  # n'ait touché au code. Mélangé à `fmt` et `clippy`, l'échec se lirait
  # « Qualité » et enverrait chercher au mauvais endroit.
  #
  # Bloquant, en revanche : une vérification non bloquante finit ignorée —
  # c'est la leçon de la carte 272, et `make lint` affichait justement une
  # étape d'audit qui ne s'exécutait jamais.
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Binaire précompilé, comme pour sqlx-cli : compiler cargo-audit sur le
      # runner coûterait plusieurs minutes à chaque exécution.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # `CI` est posée à `true` par GitHub Actions : c'est elle qui transforme
      # le SKIP tolérant en échec, pour que la disparition du binaire ne
      # ramène pas le vert silencieux.
      - name: make audit (cargo audit --deny warnings)
        run: make audit

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    env:
      # Injectée par le Makefile comme DATABASE_URL pour `reset_test_db` et `cargo test`.
      # Aligne l'URL sur le service Postgres ci-dessous (port 5432, user `dev`).
      DATABASE_URL_TEST: postgres://dev:devpassword@localhost:5432/kreek_test
      # Compile les macros query!/query_as! depuis le cache commité `.sqlx/`,
      # sans connexion DB au moment de la compilation.
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Installer sqlx-cli (binaire précompilé)
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: make test (reset_test_db + cargo test)
        run: make test

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    env:
      # Le fichier .env.dev n'est chargé qu'au runtime (dotenvy) ; la compilation
      # des macros query!/query_as! a besoin de la variable dès la compilation.
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Installer sqlx-cli (binaire précompilé)
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Les scripts d'import (import_*.sh) et l'app (AppConfig::load via dotenvy)
      # lisent tous .env.dev, gitignored donc absent en CI. On le matérialise avec
      # les creds du service Postgres ci-dessus. BYPASS_AUTH=true : les e2e passent
      # par le coach seedé DevCoach, sans login. EMAIL__API_KEY factice (aucun e2e
      # n'envoie de vrai mail).
      - name: Générer .env.dev (config CI)
        run: |
          cat > .env.dev <<'EOF'
          ENV=development
          DATABASE__URL=postgresql://dev:devpassword@localhost:5432/kreek_db
          DATABASE__HOST=localhost
          DATABASE__PORT=5432
          DATABASE__USER=dev
          DATABASE__PWD=devpassword
          DATABASE__NAME=kreek_db
          DATABASE__MAX_CONNECTIONS=20
          SERVER__HOST=0.0.0.0
          SERVER__PORT=3210
          SQLX_OFFLINE=true
          EMAIL__FROM=mailer@example.test
          EMAIL__API_KEY=dummy-key-ci
          EMAIL__FROM_NAME=KreekCI
          HOST_DOMAIN=localhost:3210
          BYPASS_AUTH=true
          REFERENCES__DIR=assets/references.example
          EOF

      # `make init_db` reposait sur scripts/extracted_*.json, non versionnés :
      # inutilisable en CI. Le seed synthétique couvre tout ce dont la suite a
      # besoin. Les migrations sont appliquées par le binaire au démarrage.
      - name: Initialiser la base (reset + seed e2e synthétique)
        run: |
          make reset_db
          make seed_e2e

      - name: Lancer le serveur en arrière-plan
        run: |
          nohup cargo run > server.log 2>&1 &
          echo $! > server.pid

      - name: Attendre que le serveur réponde
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3210 > /dev/null; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "Le serveur n'a jamais répondu." >&2
          cat server.log
          exit 1

      - name: Installer les dépendances Python + Chromium
        working-directory: tests/e2e
        run: |
          uv sync
          uv run playwright install chromium --with-deps

      - name: make e2e
        run: make e2e

      - name: Logs serveur (en cas d'échec)
        if: failure()
        run: cat server.log

      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
