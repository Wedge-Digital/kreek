# Configuration de la software factory pour kreek.
# Générée par `factory configure` le 2026-11-19 15:47, à partir de l'audit
# de `demo` @ 7b14ad8. Toutes les clés : examples/factory.toml de l'usine.
# Niveau atteignable d'après l'inventaire : minimal.

name = "kreek-kr"
base_branch = "demo"
# Racine du kanban de specs (colonnes 1-backlog … 8-abandonnee). Tickets : le défaut,
# <specs_dir>/6-prete/**/*.md. La conception par fonctionnalité reste dans docs/specs/.
specs_dir = "specs"

# Livraison déduite : remote présente, PR. À confirmer.
delivery = "pull-request"

# -- Portes ----------------------------------------------------------------
# Porte d'amorçage : prépare chaque worktree neuf avant les agents
install_command = ["make", "install"]
# Porte verte
test_command = ["make", "test"]
# Porte rouge : rapport JUnit, code de retour ignoré
red_command = ["make", "test-files", "FILES={files}", "REPORT={report}"]
# Porte rouge : erreurs du rapport JUnit qui signifient « le code testé n'existe pas encore »,
# propres au lanceur de tests (examples/factory.toml en donne pour pytest, jest, go…).
# Messages de rustc quand un test appelle du code pas encore écrit (scripts/test_files.sh
# met la sortie de cargo dans le rapport quand la compilation échoue).
red_missing_code_patterns = [
    "cannot find",                          # E0425, E0412, E0422, E0433 : fonction, type, struct absents
    "unresolved import",                    # E0432
    "failed to resolve",                    # E0433 : chemin de module absent
    "no function or associated item named", # E0599 : fonction associée absente
    "no method named",                      # E0599 : méthode absente
    "no field",                             # E0609 : champ absent
]
# Erreurs refusées en priorité (le test lui-même est cassé) : syntaxe Rust.
red_broken_test_patterns = ["expected one of", "unclosed delimiter", "unexpected closing delimiter"]
# Fichiers de test : le rédacteur de tests ne peut modifier qu'eux. Les tests Rust sont
# co-localisés dans les répertoires `tests/` des modules de src/ (doublures `fake_*` et `mod.rs`
# compris) ; les e2e Python de tests/ ne passent pas par la porte rouge (`make test-files`).
test_patterns = ["src/*/tests/*.rs"]
# Qualité des tests : scénarios given/when/then, aucun mock, aucun nom privé
# À FAIRE : cible `test-quality` absente (recommandée, porte qualité des tests). Voir `factory audit --brief`.
# Portes qualité : vérifient sans corriger
quality_gates = [
    ["make", "lint"],
    ["make", "typecheck"],
    ["make", "arch"],
]
# Réparation de forme de lint, lancée par l'usine sans agent (exigée avec lint)
gate_fixes = { "make lint" = ["make", "fix_lint"] }
# Anti-duplication : rapport jscpd (appliquée avec FAC-025)
dup_command = ["make", "dup", "REPORT={report}"]

# Aucune photo de départ : lancer `factory audit` pour vérifier que les portes sont vertes.

# -- Environnement de test d'une copie (FAC-039) ---------------------------
# Fichiers non versionnés copiés depuis ce dépôt dans chaque copie de travail (jamais committés).
worktree_files = [".env.e2e", ".env.test"]   # lus par le Makefile
# Lus aussi par le Makefile, non proposés (secrets possibles, les agents y auraient accès) : .env.dev, .env.remote.demo, .env.remote.prod
# Services démarrés avant les portes et arrêtés après ; FACTORY_SLOT distingue les copies en parallèle.
# services_command = ["make", "services"]
# services_stop_command = ["make", "services-stop"]

# -- Contexte des agents ---------------------------------------------------
# Rien n'est chargé implicitement (setting_sources=[]) : seuls ces fichiers le sont.
context_files = ["CLAUDE.md", "CONTRIBUTING.md", "specs/README.md"]
# À FAIRE : code exemplaire que les agents doivent imiter (choix humain).
reference_files = []

# -- Périmètre (à décider, non deviné) -------------------------------------
# Chemins que les agents ne modifient jamais, en plus des défauts de l'usine (specs, Makefile,
# .factory*, .claude/, configuration de test, CI) : migrations appliquées, contrats publiés,
# code généré, code embarqué…
protected_paths = []
