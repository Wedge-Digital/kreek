[server]
host = "0.0.0.0"
port = 3210
request_timeout_ms = 30000

[database]
max_connections = 20
min_connections = 1
acquire_timeout_seconds = 5
idle_timeout_seconds = 600

[auth]
token_ttl_seconds = 3600

[references]
# Répertoire des données de référence (règles de jeu), relatif au répertoire
# de lancement. Non versionné — voir README, section « Données de règles ».
dir = "assets/references"

bypass_auth = false