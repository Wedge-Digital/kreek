[server]
host = "0.0.0.0"
port = 3210
request_timeout_ms = 30000

[database]
max_connections = 20
min_connections = 1
acquire_timeout_seconds = 5
idle_timeout_seconds = 600
# Tue une session restée oisive dans une transaction (carte 317). 15 s : les
# transactions du projet sont courtes — aucune ne traverse un appel de port ou
# de bus — donc la marge est énorme, et une fuite meurt avant de bloquer quoi
# que ce soit.
idle_in_transaction_timeout_seconds = 15

[auth]
token_ttl_seconds = 3600

[email]
# « resend » par défaut : un déploiement qui oublierait de se prononcer envoie
# ses emails plutôt que de les perdre en silence. Les contextes qui ne doivent
# rien expédier posent EMAIL__PROVIDER=console — cf. la cible `dev-demo` du
# Makefile et le job e2e de la CI.
provider = "resend"

[references]
# Répertoire des données de référence (règles de jeu), relatif au répertoire
# de lancement. Le défaut est le jeu de démonstration versionné, pour qu'un
# clone frais démarre sans configuration. Une exploitation réelle surcharge
# avec REFERENCES__DIR (cf. docs/reference-data-schema.md).
dir = "assets/references.example"

bypass_auth = false